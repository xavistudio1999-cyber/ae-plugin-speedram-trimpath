<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotionFlow Toolkit</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="panel">
    <h1>MotionFlow</h1>

    <div class="group">
      <button data-action="speedram">SpeedRam</button>
      <button data-action="trimpath">Trim Path</button>
    </div>

    <div class="group">
      <button data-action="smoothflow">Smooth Flow</button>
      <button data-action="strokefill">Stroke + Fill</button>
    </div>

    <div class="group">
      <button data-action="textanim">Text Animation</button>
      <button data-action="clearconsole">Clear Console</button>
    </div>

    <div class="status" id="status">Ready</div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>

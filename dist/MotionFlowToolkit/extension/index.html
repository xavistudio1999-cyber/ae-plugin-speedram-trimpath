<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotionFlow Toolkit</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="panel">
    <h1>MotionFlow</h1>

    <div class="shortcuts">
      <p>Keyboard Shortcuts:</p>
      <ul>
        <li><kbd>S</kbd> - SpeedRam</li>
        <li><kbd>T</kbd> - Trim Path</li>
        <li><kbd>F</kbd> - Smooth Flow</li>
        <li><kbd>K</kbd> - Stroke + Fill</li>
        <li><kbd>A</kbd> - Text Animation</li>
      </ul>
    </div>

    <div class="group">
      <button data-action="speedram" data-key="s">SpeedRam (S)</button>
      <button data-action="trimpath" data-key="t">Trim Path (T)</button>
    </div>

    <div class="group">
      <button data-action="smoothflow" data-key="f">Smooth Flow (F)</button>
      <button data-action="strokefill" data-key="k">Stroke + Fill (K)</button>
    </div>

    <div class="group">
      <button data-action="textanim" data-key="a">Text Animation (A)</button>
      <button data-action="clearconsole">Clear Console</button>
    </div>

    <div class="status" id="status">Ready - Press keyboard shortcuts or click buttons</div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
